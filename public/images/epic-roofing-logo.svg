<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 90" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="shieldGradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0E1217" />
    </linearGradient>
    <linearGradient id="amberGradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2900F" />
      <stop offset="100%" stop-color="#B96F08" />
    </linearGradient>
    <filter id="dropShadowHeader" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Logo Icon on the left -->
  <g filter="url(#dropShadowHeader)" transform="translate(6, 0)">
    <!-- Polished Shield Body outer stroke in Hazard Amber -->
    <path d="M 20 18 L 76 18 L 76 48 C 76 66, 58 78, 48 83 C 38 78, 20 66, 20 48 Z" 
          fill="url(#shieldGradHeader)" stroke="#E2900F" stroke-width="4.5" stroke-linejoin="round" />
    
    <!-- White Shield inner hairline accent -->
    <path d="M 25 23 L 71 23 L 71 47 C 71 61, 56 71, 48 75 C 40 71, 25 61, 25 47 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.35" />

    <!-- Stylized Roofline in Hazard Amber Gradient -->
    <!-- Outer roof slope -->
    <path d="M 29 46 L 48 29 L 67 46" fill="none" stroke="url(#amberGradHeader)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner roof outline -->
    <path d="M 36 52 L 48 42 L 60 52" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Chimney detail -->
    <rect x="58" y="31" width="5.5" height="9" fill="url(#amberGradHeader)" />
    
    <!-- Miniature star accent -->
    <path d="M 48 53.5 L 49.5 56.5 L 53 56.5 L 50.5 58.5 L 51.5 62 L 48 60 L 44.5 62 L 45.5 58.5 L 43 56.5 L 46.5 56.5 Z" fill="#E2900F" />
  </g>

  <!-- Typography elements in Oswald font -->
  <!-- Company Name -->
  <text x="102" y="47" font-family="'Oswald', sans-serif" 
        font-weight="700" font-size="30" fill="#FFFFFF" letter-spacing="1.5">
    <tspan fill="#E2900F">EPIC</tspan> ROOFING <tspan fill="#E6EDF3" font-weight="500">TX</tspan>
  </text>
  
  <!-- Horizontal Accent Line in Hazard Amber -->
  <line x1="102" y1="56" x2="390" y2="56" stroke="#E2900F" stroke-width="2" opacity="0.9" />

  <!-- Tagline: HOUSTON'S STORM DAMAGE SPECIALISTS in IBM Plex Mono / Source Sans 3 -->
  <text x="102" y="72" font-family="'IBM Plex Mono', 'Source Sans 3', monospace" 
        font-weight="600" font-size="10" fill="#CBD5E1" letter-spacing="2" opacity="0.95">
    HOUSTON'S STORM DAMAGE SPECIALISTS
  </text>
</svg>
